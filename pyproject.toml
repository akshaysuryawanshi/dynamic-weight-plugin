[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-weight-plugin"
version = "0.1.0a1"
description = "Live weight representation changes for vLLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha"]
requires-python = ">=3.11,<3.12"
dependencies = ["vllm>=0.32.0,<=0.33.0"]

[project.optional-dependencies]
runtime032 = [
  "vllm==0.32.0", "torch==2.13.0", "transformers==5.19.0",
  "cuda-bindings==13.4.4", "bitsandbytes==0.50.2", "vllm-bnb-plugin==0.0.3",
]
runtime033 = [
  "vllm==0.33.0", "torch==2.14.0", "transformers==5.20.2",
  "cuda-bindings==13.4.4",
]

[project.entry-points."vllm.general_plugins"]
dynamic_weight = "dynamic_weight_plugin.plugin:register"

[project.entry-points."vllm.endpoint_plugins"]
dynamic_weight_api = "dynamic_weight_plugin.endpoints:DynamicWeightEndpoints"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dynamic_weight_plugin = ["compatibility*.json"]
